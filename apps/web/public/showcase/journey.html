],"links":[],"checks":[]}},"details":{"evaporation":{"id":"evaporation","title":"水，如何成为水汽？","html":"\u003carticle>\u003csection>\u003ch2>蒸发：从液态水到看不见的气体\u003c/h2>\u003cp>太阳为海洋、湖泊和河流提供能量。液态水中的分子一直在运动；吸收能量后，一部分位于水面附近的分子能够克服分子间的吸引，离开水面进入空气，成为水蒸气。这就是蒸发。蒸发不需要把水烧开，在日常温度下也会发生。\u003c/p>\u003cfigure>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 290\" role=\"img\" aria-label=\"液态水中的分子吸收太阳提供的能量，离开水面成为分散的水蒸气分子\" style=\"width:100%;height:auto;color:#2a56c6\">\u003cdefs>\u003cg id=\"mol\" fill=\"white\" stroke=\"#2a56c6\" stroke-width=\"1.7\">\u003cpath d=\"M-8 5 L0 0 8 5\" fill=\"none\"/>\u003ccircle r=\"4.5\"/>\u003ccircle cx=\"-9\" cy=\"6\" r=\"2.6\"/>\u003ccircle cx=\"9\" cy=\"6\" r=\"2.6\"/>\u003c/g>\u003cmarker id=\"head\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\u003cpath d=\"M0 1 L9 5 0 9\" fill=\"none\" stroke=\"#2a56c6\" stroke-width=\"1.4\"/>\u003c/marker>\u003c/defs>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"21\" fill=\"#161a22\" text-anchor=\"middle\">\u003ctext x=\"112\" y=\"38\">液态水\u003c/text>\u003ctext x=\"337\" y=\"38\">吸收能量\u003c/text>\u003ctext x=\"560\" y=\"38\">水蒸气\u003c/text>\u003c/g>\u003cpath d=\"M29 138 Q57 133 85 138 T141 138 197 138 V251 H29Z\" fill=\"#2a56c6\" fill-opacity=\".07\" stroke=\"#2a56c6\" stroke-width=\"1.3\"/>\u003cg>\u003cuse href=\"#mol\" x=\"58\" y=\"164\"/>\u003cuse href=\"#mol\" x=\"99\" y=\"157\"/>\u003cuse href=\"#mol\" x=\"148\" y=\"168\"/>\u003cuse href=\"#mol\" x=\"179\" y=\"193\"/>\u003cuse href=\"#mol\" x=\"75\" y=\"200\"/>\u003cuse href=\"#mol\" x=\"121\" y=\"195\"/>\u003cuse href=\"#mol\" x=\"52\" y=\"231\"/>\u003cuse href=\"#mol\" x=\"105\" y=\"231\"/>\u003cuse href=\"#mol\" x=\"153\" y=\"226\"/>\u003cuse href=\"#mol\" x=\"515\" y=\"97\"/>\u003cuse href=\"#mol\" x=\"619\" y=\"146\"/>\u003cuse href=\"#mol\" x=\"500\" y=\"218\"/>\u003cuse href=\"#mol\" x=\"586\" y=\"241\"/>\u003c/g>\u003cg fill=\"none\" stroke=\"#2a56c6\" stroke-width=\"1.4\">\u003cpath d=\"M220 180 H438\" marker-end=\"url(#head)\"/>\u003ccircle cx=\"337\" cy=\"96\" r=\"16\"/>\u003cpath d=\"M337 70 V62 M337 122 V130 M311 96 H303 M363 96 H371 M319 78 l-6 -6 M355 114 l6 6 M355 78 l6 -6 M319 114 l-6 6 M322 132 l-5 23 M339 136 v20 M356 132 l5 23\" marker-end=\"url(#head)\"/>\u003c/g>\u003c/svg>\u003cfigcaption>同样的水分子：液态时靠得较近，成为气体后分散在空气中。示意不按比例。\u003c/figcaption>\u003c/figure>\u003cp>水分子并没有变成别的物质，只是由液态转为气态。水蒸气本身是看不见的；海面上画出的蓝色流线表示水汽的上升方向，不是肉眼可见的烟雾。\u003c/p>\u003c/section>\u003csection>\u003ch2>凝结：水汽遇冷，才成为云滴\u003c/h2>\u003cp>湿润空气上升并冷却，当条件合适时，水蒸气会在空气中的微小颗粒上凝结为小水滴；低温下也可能形成冰晶。大量小水滴或冰晶聚集，才形成我们看得见的云。它们继续长大，便可能以雨或雪落回地表。\u003c/p>\u003c/section>\u003c/article>"}},"brief":{"subject":"山地到海洋的动态水循环主视觉","intent":"以精细连续自然景观展现五个水循环过程，并可打开蒸发科学详情。","audience":"DrawY 首页访客","concept":"左上雪山群锚定连续山海景观，视线沿冰川、瀑布、湖与蜿蜒深蓝河谷下行到右海；上空由海向山的细弧与下方含水层把旅程闭合。","register":"formal","style":"textbook","direction":"纯白纸、蓝黑#161a22细钢笔轮廓、强调蓝#2a56c6和透明冷蓝冷灰平涂；多层自然山脊与密集细节，不用渐变，不生成图片。","cast":[],"basis":{"subject":"画一张山地到海洋的水循环图","intent":"使它成为 DrawY 首页主视觉","register":"白纸上淡彩、细钢笔轮廓、局部排线和自然地形层次"}},"materials":{"label":{"id":"label","kind":"drawing","name":"标签","source":"// A short label in the work's type with a paper-coloured halo, so it stays legible over\r\n// pictures and lines. Lines break at \"\\n\"; an optional note sits underneath, smaller.\r\nconst d = api.data,\r\n  t = api.theme;\r\nconst W = api.width,\r\n  H = api.height;\r\nconst size = Number(d.size ?? 16);\r\nconst align = d.align ?? \"center\";\r\nconst x = align === \"start\" ? 0 : align === \"end\" ? W : W / 2;\r\nconst anchor = align === \"center\" ? \"middle\" : align;\r\nconst esc = (s) =>\r\n  String(s).replace(\r\n    /[&\u003c>\"]/g,\r\n    (ch) => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" })[ch],\r\n  );\r\nconst lines = String(d.text ?? \"\").split(\"\\n\");\r\nconst note = d.note ? String(d.note).split(\"\\n\") : [];\r\nconst noteSize = size * 0.78;\r\nconst total = lines.leng
